<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2x2 Screenshot Grid to PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .slot-card { cursor: grab; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .slot-card:active { cursor: grabbing; }
    .sortable-ghost { opacity: 0.4; background-color: #e0e7ff; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header & Controls -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">2x2 Screenshot Grid to PDF</h1>
          <p class="text-sm text-slate-500">Upload screenshots, drag to reorder, and export as a paginated 2x2 grid PDF.</p>
        </div>
        <div class="flex gap-3">
          <button id="clearBtn" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition">
            Clear All
          </button>
          <button id="exportBtn" class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition shadow-sm disabled:opacity-50" disabled>
            Download PDF
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t border-slate-100">
        <!-- Title Header Input -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">PDF Page Header Title</label>
          <input type="text" id="headerTitle" placeholder="e.g., Q4 App QA Screenshots" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Orientation Selector -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Page Orientation</label>
          <select id="pageOrientation" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="portrait">Portrait (A4)</option>
            <option value="landscape">Landscape (A4)</option>
          </select>
        </div>

        <!-- File Upload -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Add Screenshots</label>
          <input type="file" id="imageInput" multiple accept="image/*" 
                 class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
        </div>
      </div>
    </div>

    <!-- Status & Live Reorder Grid -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">
          Image Queue (<span id="imageCount">0</span> images • <span id="pageCount">0</span> PDF pages)
        </h2>
        <span class="text-xs text-slate-400">Drag cards to change order</span>
      </div>

      <div id="emptyState" class="border-2 border-dashed border-slate-200 rounded-xl p-12 text-center text-slate-400">
        No screenshots uploaded yet. Select files above to populate your 2x2 grid.
      </div>

      <!-- 2x2 Visual Preview Grid -->
      <div id="gridContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const gridContainer = document.getElementById('gridContainer');
    const emptyState = document.getElementById('emptyState');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');
    const headerTitleInput = document.getElementById('headerTitle');
    const orientationSelect = document.getElementById('pageOrientation');
    const imageCountEl = document.getElementById('imageCount');
    const pageCountEl = document.getElementById('pageCount');

    // Initialize drag-and-drop via SortableJS
    new Sortable(gridContainer, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: updateBadges
    });

    imageInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (const file of files) {
        const dataUrl = await readFileAsDataURL(file);
        const dims = await getImageDimensions(dataUrl);
        addGridItem(dataUrl, file.name, dims.width, dims.height);
      }
      imageInput.value = '';
      updateUI();
    });

    clearBtn.addEventListener('click', () => {
      gridContainer.innerHTML = '';
      updateUI();
    });

    function readFileAsDataURL(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function getImageDimensions(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
        img.src = src;
      });
    }

    function addGridItem(src, name, width, height) {
      const card = document.createElement('div');
      card.className = 'slot-card relative bg-slate-100 rounded-lg border border-slate-200 p-3 flex flex-col items-center justify-center h-64 overflow-hidden group';
      card.dataset.src = src;
      card.dataset.width = width;
      card.dataset.height = height;

      card.innerHTML = `
        <span class="slot-badge absolute top-2 left-2 bg-slate-900/75 text-white text-xs font-medium px-2 py-0.5 rounded"></span>
        <button class="remove-btn absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition">Remove</button>
        <div class="w-full h-full flex items-center justify-center overflow-hidden p-2">
          <img src="${src}" alt="${name}" class="max-w-full max-h-full object-contain rounded shadow-sm">
        </div>
        <p class="text-xs text-slate-500 truncate w-full text-center mt-1">${name}</p>
      `;

      card.querySelector('.remove-btn').addEventListener('click', () => {
        card.remove();
        updateUI();
      });

      gridContainer.appendChild(card);
    }

    function updateBadges() {
      const cards = Array.from(gridContainer.children);
      cards.forEach((card, idx) => {
        const pageNum = Math.floor(idx / 4) + 1;
        const slotNum = (idx % 4) + 1;
        card.querySelector('.slot-badge').textContent = `Page ${pageNum} • Slot ${slotNum}`;
      });
    }

    function updateUI() {
      const count = gridContainer.children.length;
      const pages = Math.ceil(count / 4);
      imageCountEl.textContent = count;
      pageCountEl.textContent = pages;
      emptyState.style.display = count === 0 ? 'block' : 'none';
      exportBtn.disabled = count === 0;
      updateBadges();
    }

    exportBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const orientation = orientationSelect.value;
      const doc = new jsPDF({ orientation, unit: 'mm', format: 'a4' });

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 12;
      const gap = 8;
      const titleText = headerTitleInput.value.trim();
      const headerOffset = titleText ? 14 : 0;

      // Calculate equal 2x2 slot dimensions
      const usableWidth = pageWidth - margin * 2;
      const usableHeight = pageHeight - margin * 2 - headerOffset;
      const slotWidth = (usableWidth - gap) / 2;
      const slotHeight = (usableHeight - gap) / 2;

      const cards = Array.from(gridContainer.children);

      cards.forEach((card, index) => {
        const slotIndex = index % 4;

        // Add new page for every group of 4 images
        if (index > 0 && slotIndex === 0) {
          doc.addPage();
        }

        // Draw header on the first slot of each page
        if (slotIndex === 0 && titleText) {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(14);
          doc.setTextColor(30, 41, 59);
          doc.text(titleText, pageWidth / 2, margin + 6, { align: 'center' });
        }

        const col = slotIndex % 2;
        const row = Math.floor(slotIndex / 2);

        const slotX = margin + col * (slotWidth + gap);
        const slotY = margin + headerOffset + row * (slotHeight + gap);

        // Optional subtle border around each equal slot
        doc.setDrawColor(226, 232, 240);
        doc.rect(slotX, slotY, slotWidth, slotHeight);

        // Scale image proportionally to fit inside slot with padding
        const pad = 2;
        const maxW = slotWidth - pad * 2;
        const maxH = slotHeight - pad * 2;
        const imgW = parseFloat(card.dataset.width);
        const imgH = parseFloat(card.dataset.height);

        const ratio = Math.min(maxW / imgW, maxH / imgH);
        const renderW = imgW * ratio;
        const renderH = imgH * ratio;

        // Center within the slot
        const renderX = slotX + (slotWidth - renderW) / 2;
        const renderY = slotY + (slotHeight - renderH) / 2;

        doc.addImage(card.dataset.src, 'JPEG', renderX, renderY, renderW, renderH);
      });

      const filename = titleText ? `${titleText.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.pdf` : 'screenshot-grid.pdf';
      doc.save(filename);
    });
  </script>
</body>
</html>
